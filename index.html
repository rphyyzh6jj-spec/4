<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albion Flip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Albion Flip">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root { --bg:#14151f; --card:#1e2030; --line:#2c2f45; --text:#e8e9f2; --mute:#8d90a8; --gold:#f2b632; --gain:#5fd38d; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--text);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom)); }
main { max-width: 720px; margin: 0 auto; padding: 12px 14px; }
h1 { font-size: 20px; margin: 6px 0 10px; } h1 span { color: var(--gold); }
details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
summary { font-weight:600; cursor:pointer; }
.form { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px; }
.form label { display:flex; flex-direction:column; font-size:12px; color:var(--mute); gap:4px; }
.form .wide { grid-column: 1 / -1; }
input, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:9px 10px; font-size:16px; }
.check { flex-direction:row !important; align-items:center; gap:8px !important; font-size:14px !important; color:var(--text) !important; }
.check input { width:auto; transform:scale(1.2); }
button { font-size:16px; border:0; border-radius:10px; padding:12px 16px; font-weight:600; }
.link { background:none; color:var(--mute); padding:6px 0; font-size:13px; text-decoration:underline; font-weight:400; }
#status { white-space:pre-line; margin:12px 2px 6px; color:var(--mute); font-size:13px; min-height:18px; }
progress { width:100%; height:6px; accent-color: var(--gold); }
.sortrow { display:flex; align-items:center; gap:8px; margin:10px 0; font-size:13px; color:var(--mute); }
.sortrow select { width:auto; flex:1; padding:7px 8px; font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:10px; }
.card header { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; }
.tier { color:var(--gold); font-weight:700; white-space:nowrap; }
.grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px 12px; }
.grid small { display:block; color:var(--mute); font-size:11px; margin-bottom:1px; }
.gain { color:var(--gain); }
.card footer { color:var(--mute); font-size:11px; margin-top:8px; }
.bar { position:fixed; left:0; right:0; bottom:0; background:rgba(20,21,31,.94); backdrop-filter: blur(8px);
  border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
.bar button { flex:1; font-size:15px; padding:12px 6px; } #go { background:var(--gold); color:#1a1405; flex:2; }
#route { background:#2b3f73; color:#fff; flex:2; }
#stop { background:var(--card); color:var(--text); border:1px solid var(--line); }
#go:disabled, #route:disabled, #stop:disabled { opacity:.45; }
.tabs { display:flex; gap:6px; margin:10px 0; }
.tabs button { flex:1; padding:9px 4px; font-size:14px; background:var(--card); color:var(--text); border:1px solid var(--line); }
.tabs button.on { background:var(--gold); color:#1a1405; border-color:var(--gold); }
[hidden] { display:none !important; }
.its { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
.it { margin-bottom:7px; font-size:14px; } .it small { color:var(--mute); font-size:12px; }
.r1 { color:var(--gain); } .r2 { color:var(--gold); } .r3 { color:#ff6b6b; }
.note { color:var(--mute); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Albion <span>Flip</span></h1>

  <details id="filters" open>
    <summary>Фильтры</summary>
    <div class="form">
      <label>Сервер<select id="server"></select></label>
      <label>Город<select id="city"></select></label>
      <label class="wide">Категория<select id="cat"></select></label>
      <label>Бюджет (серебро)<input id="budget" type="text" inputmode="numeric"></label>
      <label>Макс. зачарование<input id="emax" type="number" min="0" max="4"></label>
      <label>Тир от<input id="tmin" type="number" min="1" max="8"></label>
      <label>Тир до<input id="tmax" type="number" min="1" max="8"></label>
      <label>Свежесть цен до (мин)<input id="maxage" type="number" min="1"></label>
      <label>Мин. продаж за 24ч<input id="minvol" type="number" min="0"></label>
      <label>Мин. ROI %<input id="minroi" type="number" step="0.1"></label>
      <label>Макс. ROI %<input id="maxroi" type="number" step="1"></label>
      <label class="wide check"><input id="premium" type="checkbox"> Есть премиум (налог 4% вместо 8%)</label>
    </div>
    <button class="link" id="refresh" type="button">Обновить список предметов</button>
  </details>

  <div id="status">Выбери фильтры и нажми «Сканировать». Макс. ROI отсекает подозрительные цены.</div>
  <progress id="pb" value="0" max="1"></progress>

  <div class="sortrow" id="sortrow">Сортировать:
    <select id="sort">
      <option value="total">по общей прибыли</option>
      <option value="roi">по ROI</option>
      <option value="vol">по объёму продаж</option>
      <option value="profit">по прибыли с штуки</option>
    </select>
  </div>

  <div class="tabs" id="tabs" hidden></div>

  <div id="list"></div>
  <p class="note">Программа только показывает расчёты и ничего не делает в игре. Ордера ставишь сам.
  Объёмы присылают игроки, реальные продажи обычно выше.</p>
</main>

<div class="bar">
  <button id="go">Сканировать</button>
  <button id="route">Между городами</button>
  <button id="stop">Стоп</button>
</div>
<script src="app.js?v=8"></script>
</body>
</html>
